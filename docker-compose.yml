name: ai-agent

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_agent}
      MYSQL_USER: ${MYSQL_USER:-ai_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai-agent-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai-agent-root-local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env
        required: false
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_agent}
      MYSQL_USER: ${MYSQL_USER:-ai_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai-agent-local}
    volumes:
      - conversation_history:/app/conversation_history
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  mysql_data:
  conversation_history:
