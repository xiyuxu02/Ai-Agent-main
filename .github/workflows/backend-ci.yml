name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile application
        run: python -m compileall -q app
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Run build smoke test
        run: npm run test:smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  containers:
    name: Container checks
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build
      - name: Start the container stack
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test the container stack
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/backend/health > /dev/null
          docker compose exec -T database sh -c '
            test "$(mysql -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM orders")" -eq 3 &&
            test "$(mysql -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN (\"orders\", \"logistics_tracking\", \"tickets\", \"pending_actions\")")" -eq 4
          '
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the container stack
        if: always()
        run: docker compose down --volumes --remove-orphans
